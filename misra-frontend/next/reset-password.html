<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New password · MISRA EDU</title><link rel="icon" href="../assets/logo.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="ledger.css?v=2"><script src="../js/app.js?v=3" defer></script><script src="common.js?v=1" defer></script><script src="../js/auth.js?v=3" defer></script></head><body data-native-auth="reset"><main class="native-auth"><a class="brand" href="login.html" aria-label="MISRA EDU sign in"><img class="logo-light" src="../assets/logo-transparent.png" alt="MISRA EDU"><img class="logo-dark" src="../assets/logo-white.png" alt="" aria-hidden="true"></a><h1>Choose a new password</h1><form data-reset-password-form novalidate><div class="field" data-field="new-password"><label for="reset-new-password">New password</label><input id="reset-new-password" name="new_password" type="password" minlength="10" maxlength="1024" autocomplete="new-password" required><span class="field-hint">At least 10 characters.</span><span class="field-error"><span>Use at least 10 characters.</span></span></div><div class="field" data-field="confirm-password"><label for="reset-confirm-password">Confirm new password</label><input id="reset-confirm-password" name="confirm_password" type="password" autocomplete="new-password" required><span class="field-error"><span>The passwords do not match.</span></span></div><button class="primary" type="submit">Update password</button></form><section data-reset-invalid hidden role="alert"><h2>Reset link unavailable</h2><p>This link is missing its reset token.</p><a href="forgot-password.html">Request another link</a></section><section data-reset-success hidden role="status"><h2>Password updated</h2><p>Old sessions are invalidated. Sign in with your new password.</p><a href="login.html">Sign in</a></section></main></body></html>
