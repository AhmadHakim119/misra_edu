<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · MISRA EDU</title><link rel="icon" href="../assets/logo.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="ledger.css?v=2"><script src="../js/app.js?v=3" defer></script><script src="common.js?v=1" defer></script><script src="../js/auth.js?v=3" defer></script></head><body data-native-auth="login"><main class="native-auth"><a class="brand" href="index.html" aria-label="MISRA EDU home"><img class="logo-light" src="../assets/logo-transparent.png" alt="MISRA EDU"><img class="logo-dark" src="../assets/logo-white.png" alt="" aria-hidden="true"></a><h1>Sign in to your workspace</h1><p>Your assessments, approved marking guides and student papers stay in your private instructor workspace.</p><form data-login-form novalidate><div class="field" data-field="email"><label for="login-email">Email</label><input id="login-email" name="email" type="email" autocomplete="email" required><span class="field-error"><span>Enter a valid email address.</span></span></div><div class="field" data-field="password"><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required><button type="button" data-toggle-password="login-password" aria-label="Show password">Show password</button><span class="field-error"><span>Password is required.</span></span></div><label class="check-row"><input name="remember" type="checkbox"> Keep me signed in</label><button type="submit" class="primary">Sign in</button></form><p><a href="forgot-password.html">Forgot password?</a></p><p class="muted">Accounts are created by the MISRA administrator.</p></main></body></html>
