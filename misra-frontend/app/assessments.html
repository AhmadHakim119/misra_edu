<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assessments · MISRA EDU</title><link rel="icon" href="../assets/logo.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="ledger.css?v=2"><script src="../js/app.js?v=3" defer></script><script src="../js/api.js?v=24" defer></script><script src="common.js?v=1" defer></script><script src="assessments.js?v=3" defer></script><link rel="stylesheet" href="app.css"><script src="locale.js" defer></script><script src="app-shell.js" defer></script></head><body><main class="native-page"><header class="workflow-heading"><div><h1>Your assessments</h1><p>Choose one assessment to prepare, mark and export its papers.</p></div><button id="open-creation" type="button" class="primary">Create assessment</button></header><p id="manager-status" role="status"></p><section id="creation" class="workflow-panel" hidden><h2>Create an assessment</h2><form id="create-assessment"><div class="field"><label for="manager-course">Course</label><select id="manager-course" name="course_id" required></select></div><button type="button" id="add-course">Add a course</button><div class="field"><label for="manager-title">Assessment title</label><input id="manager-title" name="title" required maxlength="255" placeholder="e.g. Work & energy quiz"></div><div class="field"><label for="manager-language">Language</label><select id="manager-language" name="language"><option value="en">English</option><option value="ar">Arabic</option><option value="mixed">Mixed</option></select></div><button class="primary" type="submit">Create &amp; prepare assessment</button><button type="button" id="close-creation">Cancel</button></form><form id="create-course" hidden><h3>Add a course</h3><div class="author-grid"><div class="field"><label for="manager-code">Course code</label><input id="manager-code" name="course_code" required maxlength="50"></div><div class="field"><label for="manager-term">Term (optional)</label><input id="manager-term" name="term" maxlength="50"></div></div><div class="field"><label for="manager-course-title">Course title</label><input id="manager-course-title" name="title" required maxlength="255"></div><div class="field"><label for="manager-instructor">Instructor name</label><input id="manager-instructor" name="instructor_name" required maxlength="255"></div><button class="primary" type="submit">Save course</button></form></section><label for="manager-search">Find an assessment</label><input id="manager-search" type="search" placeholder="Search title or course"><div id="manager-list"><p>Loading assessments…</p></div></main></body></html>
