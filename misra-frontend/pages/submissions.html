<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extraction results · MISRA EDU</title>
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css?v=3"><link rel="stylesheet" href="../css/base.css?v=3"><link rel="stylesheet" href="../css/workspace.css?v=17">
</head>
<body class="workspace-body" data-page="submissions">
  <main class="workspace-content" id="workspace-content">
    <header class="page-heading">
      <div><h1>Extraction results</h1><p>Verify that every expected question has the right OCR segments before any AI grading begins.</p></div>
      <div class="page-actions"><a class="btn btn-primary" href="upload.html">Upload papers</a></div>
    </header>
    <section class="workspace-card card-pad">
      <div class="submission-filters">
        <div class="field"><label for="submission-exam">Assessment</label><select class="input select" id="submission-exam"><option value="">All assessments</option></select></div>
        <div class="field"><label for="submission-readiness">Mapping status</label><select class="input select" id="submission-readiness"><option value="all">All results</option><option value="attention">Action required</option><option value="ready">Ready to grade</option></select></div>
        <div class="field"><label for="submission-identity">Student identity</label><select class="input select" id="submission-identity"><option value="all">All identities</option><option value="attention">Missing name or ID</option><option value="complete">Name and ID recorded</option></select></div>
      </div>
      <div id="submissions-result" aria-live="polite"><div class="loading-list"><div class="skel loading-row"></div><div class="skel loading-row"></div><div class="skel loading-row"></div></div></div>
    </section>
  </main>
  <script src="../js/app.js?v=3"></script><script src="../js/api.js?v=15"></script><script src="../js/workspace.js?v=13"></script><script src="../js/submissions.js?v=5"></script>
</body>
</html>
