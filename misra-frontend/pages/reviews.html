<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review queue · MISRA EDU</title>
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/workspace.css">
</head>
<body class="workspace-body" data-page="review">
  <main class="workspace-content" id="workspace-content">
    <header class="page-heading"><div><h1>Review queue</h1><p>Resolve material mode disagreements and low-confidence grades. Every decision creates an evaluation label.</p></div></header>
    <section class="workspace-card card-pad" style="margin-bottom:20px"><div class="field" style="margin:0"><label for="review-exam">Assessment</label><select class="input select" id="review-exam"><option value="">Loading assessments…</option></select></div></section>
    <div class="review-layout">
      <section class="workspace-card card-pad">
        <div class="section-head"><div><h2 class="section-title">Flagged answers</h2><p class="section-copy" id="queue-count">Choose an assessment.</p></div></div>
        <div id="review-list" class="question-list" aria-live="polite"></div>
      </section>
      <aside id="review-detail" aria-live="polite"></aside>
    </div>
  </main>
  <script src="../js/app.js"></script><script src="../js/api.js?v=11"></script><script src="../js/workspace.js?v=5"></script><script src="../js/reviews.js?v=2"></script>
</body>
</html>
