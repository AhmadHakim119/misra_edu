<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grading results · MISRA EDU</title>
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css?v=4"><link rel="stylesheet" href="../css/base.css?v=3"><link rel="stylesheet" href="../css/workspace.css?v=26">
  <link rel="stylesheet" href="../css/workflow-ease.css?v=1">
</head>
<body class="workspace-body" data-page="grades" data-page-title="Grading results">
  <main class="workspace-content" id="workspace-content">
    <header class="page-heading grade-page-heading">
      <div><a class="back-link" href="grades.html">← Grades</a><h1 id="result-title">Grading results</h1><p id="result-meta">Loading persisted grades…</p></div>
      <div class="page-actions" id="result-actions"></div>
    </header>
    <ol class="paper-steps" aria-label="Paper workflow"><li>1. Upload received</li><li>2. Check answers</li><li aria-current="step">3. Grade &amp; review</li><li>4. Export</li></ol>
    <div id="result-error" aria-live="assertive"></div>
    <section id="grading-job" aria-live="polite"></section>
    <section id="grade-summary" aria-live="polite"><div class="skel" style="height:170px"></div></section>
    <section class="grade-results-sheet workspace-card" aria-labelledby="question-results-title">
      <div class="grade-results-head"><div><h2 class="section-title" id="question-results-title">Question results</h2><p class="section-copy" id="question-results-copy">Loading scores and feedback…</p></div><button class="btn btn-ghost" id="toggle-results" type="button" hidden>Expand all</button></div>
      <div class="task-tools" id="grade-navigation" hidden><div class="field"><label for="grade-question-jump">Go to a question</label><select class="input select" id="grade-question-jump"><option value="">Choose a question…</option></select></div><div class="segmented" aria-label="Show question results"><button type="button" data-grade-filter="all" aria-pressed="true">All questions</button><button type="button" data-grade-filter="review" aria-pressed="false">Needs review</button></div><button type="button" class="btn btn-secondary" id="next-grade-review" hidden>Next flagged answer</button></div>
      <p class="task-empty" id="grade-filter-empty" hidden>No flagged answers. You can still check or edit any grade in All questions.</p>
      <div id="grade-questions" aria-live="polite"><div class="loading-list card-pad"><div class="skel loading-row"></div><div class="skel loading-row"></div><div class="skel loading-row"></div></div></div>
    </section>
  </main>
  <script src="../js/app.js?v=3"></script><script src="../js/api.js?v=21"></script><script src="../js/workspace.js?v=18"></script><script src="../js/grade-results.js?v=21"></script>
</body>
</html>
